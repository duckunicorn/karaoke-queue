<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b16">
<title>Karaoke Queue · Add a song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="common.js"></script>
<style>
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(14,11,22,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; padding-bottom: 12px; }
  header .brand { font-size: 1.15rem; }
  header .room { font-size: .8rem; color: var(--muted); text-align: right; }
  header .room b { color: var(--accent2); letter-spacing: .1em; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 14px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; }

  .now { display: flex; gap: 12px; align-items: center; }
  .now img { width: 96px; height: 54px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; background: var(--panel2); }
  .now .who b { display: block; font-size: 1.15rem; }
  .now .who span { color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .yourturn { background: linear-gradient(135deg, var(--accent), #ff8a5c); color: #fff; border: 0; text-align: center; font-weight: 800; font-size: 1.3rem; padding: 18px; }
  .yourturn span { display: block; font-weight: 400; font-size: .95rem; opacity: .9; }

  label.lbl { display: block; font-weight: 600; font-size: .9rem; margin: 0 0 6px; }
  .field + .field { margin-top: 12px; }
  .searchrow { display: flex; gap: 8px; }
  .searchrow input { flex: 1; min-width: 0; }
  .hint { font-size: .85rem; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
  .hint b { color: var(--text); }

  .results { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .results li { display: flex; gap: 10px; align-items: center; background: var(--panel2); border-radius: 12px; padding: 8px; }
  .results img { width: 88px; height: 50px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; }
  .results .info { flex: 1; min-width: 0; }
  .results .info b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .92rem; font-weight: 600; }
  .results .info span { font-size: .78rem; color: var(--muted); }
  .results .btn { flex: 0 0 auto; }
  .results .blocked { color: var(--bad); font-weight: 600; }

  ol.q { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  ol.q li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--panel2); }
  ol.q li.mine { outline: 1.5px solid var(--accent); }
  ol.q .pos { font-weight: 800; color: var(--muted); width: 1.6em; text-align: center; flex: 0 0 auto; }
  ol.q .who { flex: 1; min-width: 0; }
  ol.q .who b { display: block; font-size: .95rem; }
  ol.q .who b .you { font-size: .7rem; background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  ol.q .who span { display: block; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.q .x { background: transparent; border: 0; color: var(--muted); font-size: 1.1rem; padding: 6px 8px; cursor: pointer; }
  .empty { color: var(--muted); font-size: .9rem; }

  #roomForm h1 { font-size: 2rem; letter-spacing: -.02em; margin: 30px 0 8px; }
  #roomForm input { text-transform: uppercase; letter-spacing: .2em; font-size: 1.5rem; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><span style="color:var(--accent)">🎤</span> Karaoke Queue</div>
    <div class="room"><span class="status connecting" id="status">Connecting…</span><br><span id="roomLabel"></span></div>
  </div>
</header>

<main class="wrap">
  <!-- Shown when there's no room code in the link -->
  <form id="roomForm" class="hidden">
    <h1>Join the party</h1>
    <p class="muted">Enter the room code shown on the big screen.</p>
    <div class="field"><input id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></div>
    <p><button class="btn" style="width:100%">Join</button></p>
  </form>

  <div id="app" class="hidden">
    <div id="turnBanner" class="card yourturn hidden"></div>

    <section class="card" id="nowCard">
      <h2 id="nowLabel">Now singing</h2>
      <div id="nowBody" class="empty">Waiting for the first song…</div>
    </section>

    <section class="card">
      <h2>Add a song</h2>
      <div class="field">
        <label class="lbl" for="name">Your name</label>
        <input id="name" maxlength="40" placeholder="So we know who's singing" autocomplete="nickname">
      </div>
      <form class="field" id="searchForm">
        <label class="lbl" for="q" id="qLabel">Song</label>
        <div class="searchrow">
          <input id="q" placeholder="Song or artist" autocomplete="off" enterkeyhint="search">
          <button class="btn" id="goBtn">Search</button>
        </div>
      </form>
      <p class="hint" id="hint"></p>
      <ul class="results" id="results"></ul>
    </section>

    <section class="card">
      <h2>Queue <small id="qCount"></small></h2>
      <ol class="q" id="queue"></ol>
    </section>
  </div>
</main>

<div id="toasts"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const { LS, esc, toast } = KQ;

  const clientId = LS.get('kq-client', null) || (() => { const id = KQ.uid(); LS.set('kq-client', id); return id; })();
  let name = LS.get('kq-name', '');
  let room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let peer = null, conn = null, state = null, retryTimer = null;
  let reqSeq = 0, lastReq = 0, buzzedFor = null;

  // ---------- Connection ----------
  function setStatus(cls, text) { const el = $('#status'); el.className = 'status ' + cls; el.textContent = text; }
  function scheduleRetry(ms) { clearTimeout(retryTimer); retryTimer = setTimeout(connect, ms); }

  function connect() {
    clearTimeout(retryTimer);
    if (!room) return;
    if (peer && !peer.destroyed && peer.open) return openConn();
    if (peer) { const old = peer; peer = null; try { old.destroy(); } catch {} }
    setStatus('connecting', 'Connecting…');
    const p = peer = new Peer({ debug: 1 });
    p.on('open', () => { if (p === peer) openConn(); });
    p.on('disconnected', () => { if (p === peer && !p.destroyed) try { p.reconnect(); } catch {} });
    p.on('error', e => {
      if (p !== peer) return;
      if (e.type === 'peer-unavailable') setStatus('bad', `Can't find room ${room}`);
      else setStatus('bad', 'Connection problem');
      scheduleRetry(e.type === 'peer-unavailable' ? 4000 : 3000);
    });
  }

  function openConn() {
    if (conn && conn.open) return;
    if (conn) { const old = conn; conn = null; try { old.close(); } catch {} }
    const c = conn = peer.connect(KQ.PEER_PREFIX + room, { reliable: true, serialization: 'json' });
    c.on('open', () => { if (c !== conn) return; setStatus('ok', 'Connected'); clearTimeout(retryTimer); });
    c.on('data', m => { if (c === conn) onMsg(m); });
    c.on('close', () => { if (c !== conn) return; setStatus('bad', 'Reconnecting…'); scheduleRetry(2000); });
    c.on('error', () => { if (c === conn) scheduleRetry(3000); });
    // If the channel never opens (bad network), try again.
    setTimeout(() => { if (c === conn && !c.open) scheduleRetry(0); }, 12000);
  }

  function send(m) {
    if (conn && conn.open) { conn.send(m); return true; }
    toast('Not connected to the big screen yet. Hang on…');
    connect();
    return false;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && room && !(conn && conn.open)) connect();
  });

  function onMsg(m) {
    if (!m || typeof m !== 'object') return;
    if (m.type === 'state') { state = m; render(); }
    else if (m.type === 'toast') { if (!m.to || m.to === clientId) toast(m.text, m.ms || 3500); }
    else if (m.type === 'searchResults' && m.reqId === lastReq) {
      if (m.error) { $('#results').innerHTML = ''; toast(m.error); return; }
      renderResults(m.results, 'No karaoke videos found. Try different words.');
    }
  }

  // ---------- Adding songs ----------
  $('#name').value = name;
  $('#name').addEventListener('input', e => { name = e.target.value.trim(); LS.set('kq-name', name); });

  $('#q').addEventListener('input', updateGoBtn);
  function updateGoBtn() {
    const v = $('#q').value.trim();
    $('#goBtn').textContent = KQ.ytId(v) ? 'Add' : (state && state.search) ? 'Search' : 'Find';
  }

  $('#searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('#q').value.trim();
    if (!text) return $('#q').focus();
    const id = KQ.ytId(text);
    if (id) {
      $('#results').innerHTML = '<li class="empty" style="background:none">Checking the video…</li>';
      const info = await KQ.checkVideo(id);
      if (info.status === 'missing') { $('#results').innerHTML = ''; toast(KQ.MISSING_MSG, 5000); return; }
      renderResults([{ videoId: id, title: info.title || 'YouTube video', channel: info.channel, blocked: info.status === 'blocked' }]);
      if (info.status === 'blocked') $('#hint').innerHTML = "❌ That video can't play on the big screen because its owner blocks it on other sites. Tap <b>Find</b> to search again and pick another upload. <b>Zoom Karaoke</b>, <b>Atomic Karaoke</b> and <b>Party Tyme</b> versions work. Sing King and KaraFun don't.";
      return;
    }
    if (state && state.search) {
      lastReq = ++reqSeq;
      $('#results').innerHTML = '<li class="empty" style="background:none">Searching…</li>';
      $('#q').blur();
      send({ type: 'search', q: text, reqId: lastReq });
    } else {
      window.open(KQ.youtubeSearchUrl(text), '_blank');
      $('#q').value = '';
      updateGoBtn();
      $('#hint').innerHTML = 'On YouTube, pick a karaoke video, tap <b>Share → Copy link</b>, then come back and paste it in the box above. (Sing King and KaraFun videos are hidden from that search because they can\'t play on the big screen.)';
    }
  });

  let shown = [];
  function renderResults(list, emptyText) {
    shown = list;
    $('#results').innerHTML = list.length ? list.map((r, i) => `
      <li><img src="${KQ.thumb(r.videoId)}" alt="" loading="lazy">
        <div class="info"><b>${esc(r.title)}</b><span>${r.blocked ? '<span class="blocked">Can\'t play on the big screen</span>' : esc(r.channel || '')}</span></div>
        ${r.blocked ? '<button class="btn small ghost" disabled>Blocked</button>' : `<button class="btn small" data-i="${i}">Add</button>`}</li>`).join('')
      : `<li class="empty" style="background:none">${esc(emptyText || '')}</li>`;
  }

  $('#results').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    const r = shown[+b.dataset.i]; if (!r) return;
    if (!name) { $('#name').focus(); toast('Add your name first so we know who is singing.'); return; }
    if (send({ type: 'add', videoId: r.videoId, title: r.title, singer: name, clientId })) {
      $('#results').innerHTML = ''; shown = [];
      $('#q').value = ''; updateGoBtn();
    }
  });

  $('#queue').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    if (confirm('Remove this song from the queue?')) send({ type: 'remove', id: b.dataset.id, clientId });
  });

  // ---------- Rendering ----------
  function render() {
    if (!state) return;
    const { now, queue, phase } = state;

    // Now playing
    if (now) {
      $('#nowLabel').textContent = phase === 'intermission' ? 'Up next on stage' : 'Now singing';
      $('#nowBody').className = 'now';
      $('#nowBody').innerHTML = `<img src="${KQ.thumb(now.videoId)}" alt=""><div class="who"><b>${esc(now.singer)}</b><span>${esc(now.title)}</span></div>`;
    } else {
      $('#nowLabel').textContent = 'Now singing';
      $('#nowBody').className = 'empty';
      $('#nowBody').textContent = phase === 'waiting' ? 'The big screen hasn\'t started yet. Add songs now!' : 'Nobody yet. Add a song and you\'re up!';
    }

    // Your-turn banner
    const banner = $('#turnBanner');
    const myNow = now && now.clientId === clientId;
    const myNext = !myNow && queue[0] && queue[0].clientId === clientId;
    if (myNow) {
      banner.innerHTML = `🎤 You're up!<span>${esc(now.title)}. Grab the mic!</span>`;
      banner.classList.remove('hidden');
      if (buzzedFor !== now.id) { buzzedFor = now.id; navigator.vibrate?.([200, 100, 200, 100, 400]); }
    } else if (myNext) {
      banner.innerHTML = `You're next!<span>Get ready: ${esc(queue[0].title)}</span>`;
      banner.classList.remove('hidden');
    } else banner.classList.add('hidden');

    // Queue
    $('#qCount').textContent = queue.length ? `${queue.length} song${queue.length === 1 ? '' : 's'}` : '';
    $('#queue').innerHTML = queue.length ? queue.map((q, i) => {
      const mine = q.clientId === clientId;
      return `<li class="${mine ? 'mine' : ''}"><span class="pos">${i + 1}</span>
        <div class="who"><b>${esc(q.singer)}${mine ? '<span class="you">YOU</span>' : ''}</b><span>${esc(q.title)}</span></div>
        ${mine ? `<button class="x" data-id="${esc(q.id)}" aria-label="Remove">✕</button>` : ''}</li>`;
    }).join('') : '<li class="empty" style="background:none">The queue is empty.</li>';

    // Hints depend on whether the host turned on search
    $('#q').placeholder = state.search ? 'Song or artist, or a YouTube link' : 'Song name, or paste a YouTube link';
    if (!$('#results').children.length) {
      $('#hint').innerHTML = state.search
        ? 'Search for a song and tap <b>Add</b>. You can also paste a YouTube link.'
        : 'Type a song and tap <b>Find</b> to look on YouTube, then copy the video link and paste it here.';
    }
    updateGoBtn();
  }

  // ---------- Start ----------
  function showApp() {
    $('#roomForm').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#roomLabel').innerHTML = `Room <b>${esc(room)}</b>`;
    connect();
  }

  $('#roomForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#roomInput').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!v) return;
    room = v;
    history.replaceState(null, '', '?room=' + room);
    showApp();
  });

  if (room) showApp();
  else { $('#roomForm').classList.remove('hidden'); setStatus('', 'Not connected'); $('#roomInput').focus(); }
})();
</script>
</body>
</html>
